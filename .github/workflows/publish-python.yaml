name: Publish Python wheels

# Invoked as a job of release.yaml right after the release tag is pushed. PyO3 builds abi3
# wheels, so one wheel per platform covers every supported CPython.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish, e.g. v0.1.0
        required: true
        type: string
      dry_run:
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      dry_run:
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  check-version:
    name: Verify tag matches crate version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Compare tag to crate version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag_version="$(echo "${RELEASE_TAG}" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+.*$')"
          cargo_version="$(awk '/^\[package\]/{f=1;next} /^\[/{f=0} f && /^version = /{gsub(/version = "|"/,""); print; exit}' python/Cargo.toml)"
          if [ "${tag_version}" != "${cargo_version}" ]; then
            echo "::error::Tag ${RELEASE_TAG} (version ${tag_version}) does not match python/Cargo.toml version ${cargo_version}"
            exit 1
          fi

  build-wheels:
    name: build (${{ matrix.target }})
    needs: check-version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            manylinux: auto
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            manylinux: auto
          - target: aarch64-apple-darwin
            runner: macos-14
            manylinux: auto
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            manylinux: auto
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist

      - name: Smoke-test the built wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --only-binary :all: pytest==9.1.1
          req="$RUNNER_TEMP/wheel-requirement.txt"
          python - "$req" <<'PY'
          import hashlib, pathlib, sys
          (whl,) = pathlib.Path("python/dist").glob("*.whl")
          digest = hashlib.sha256(whl.read_bytes()).hexdigest()
          pathlib.Path(sys.argv[1]).write_text(f"{whl.resolve().as_uri()} --hash=sha256:{digest}\n")
          PY
          python -m pip install --require-hashes --no-index --no-deps --only-binary :all: -r "$req"
          python -m pytest python/tests

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.target }}
          path: python/dist/*.whl
          if-no-files-found: error

  build-sdist:
    name: build (sdist)
    needs: check-version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: python
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-sdist
          path: python/dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        if: inputs.dry_run != true
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
          skip-existing: true
          attestations: false
