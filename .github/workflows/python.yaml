name: Python

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wheel:
    name: wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.1"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build the wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: python
          args: --release --out dist

      - name: Install the wheel and run the tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --only-binary :all: pytest==9.1.1
          req="$RUNNER_TEMP/wheel-requirement.txt"
          python - "$req" <<'PY'
          import hashlib, pathlib, sys
          (whl,) = pathlib.Path("python/dist").glob("*.whl")
          digest = hashlib.sha256(whl.read_bytes()).hexdigest()
          pathlib.Path(sys.argv[1]).write_text(f"{whl.resolve().as_uri()} --hash=sha256:{digest}\n")
          PY
          python -m pip install --require-hashes --no-index --no-deps --only-binary :all: -r "$req"
          python -m pytest python/tests
